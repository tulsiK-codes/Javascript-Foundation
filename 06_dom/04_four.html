<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit and Remove elements | DOM</title>
</head>
<body style="background-color: #212121; color: #fff;">
    <ul class="language">
        <li>Java</li>
    </ul>
</body>
<script>
    // Lets ADD li(here lanuages) to document using DOM
    function addLang(langName) {
        /* create li
        select ul from the body
        Then append the li to ul*/
        const li = document.createElement('li');
        // li.innerHTML = `${langName}`;
        li.textContent = `${langName}`;//Safer option
        document.querySelector('.language').appendChild(li);
    }
    addLang('Python')
    addLang('Kotlin')
    //Let write optimised code for this
    function addOptiLang(langName){
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(langName));//Optimised way to add text node
        document.querySelector('.language').appendChild(li);
    }
    addOptiLang('Javascript');
    //Editing an element using DOM
    /*First select then edit*/

    //Selecting the 3rd li
    const thirdLang = document.querySelector('.language li:nth-child(3)');//Better way for selcting
    // const thirdLang = document.querySelector('li:nth-child(3)'); --> then this

    //Editing
    // thirdLang.innerHTML = "Go"; -->Not safe
    // thirdLang.textContent = "Go"; //-->safer than innerHTML, but not optimised

    //creating a new li and replacing
    const newLi = document.createElement('li');
    newLi.appendChild(document.createTextNode("Ruby"));
    thirdLang.replaceWith(newLi);

    //Editing with outerHTML
    const firstLang = document.querySelector('.language li:first-child');
    firstLang.outerHTML = "<li>TypeScript</li>"

    //Remove 
    const lastLang = document.querySelector('.language li:last-child');
    lastLang.remove();
</script>
</html>
