<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Color Changer</title>
</head>
<link rel="stylesheet" href="style.css">

<body>
    <nav>
        <a href="#" aria-current="page">Home</a>
        <a href="#">More</a>
    </nav>

    <div class="canvas">
        <h1>Color Scheme Switcher</h1>
        <div class="switch">
            <span class="button button--grey" data-color="#808080"></span>
            <span class="button button--pink" data-color="#ffc0cb"></span>
            <span class="button button--blue" data-color=" #00d5ff"></span>
            <span class="button button--orange" data-color="#ffc800"></span>
        </div>

        <h2>Try clicking on one of the colors above</h2>
        <span>to change the background color of this page!</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
