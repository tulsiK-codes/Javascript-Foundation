<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React</title>
</head>
<body>
    <h2>React (Early use of bind when it was not abstracted)</h2>
    <button>Button clicked</button>
</body>
<script>
    class React {
        constructor() {
            this.library = "React";
            this.server = "https://localhost:3000";

            //Requirement: Access to the button and show some message
            document
            .querySelector('button')
            .addEventListener('click', this.handleClick.bind(this)); //To keep the reference of this(class context)
        }
        handleClick() {
            console.log("button clicked");
            console.log(this.server); //undefined. why? -> when button is clicked, it saves the reference of button in this but server, library data is lost. So use bind to bind this of (server & library along with button)
            console.log(this);
            
        }
    }
    const app = new React;
    console.log(app);
    

</script>
</html>
