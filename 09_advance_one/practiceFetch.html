<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API</title>
</head>
<body style="background-color: #414141; color: #fff;">
    <h1>Understanding Fetch</h1>
</body>
<script>
    /* Using Practice API 'https://jsonplaceholder.typicode.com/posts' */

// POST
const newData = {
    userID: 1,
    name: "Mohit"
};

fetch('https://jsonplaceholder.typicode.com/posts', {
    method: 'POST',
    headers: {
        'Content-Type': 'application/json'
    },
    body: JSON.stringify(newData)
})
.then((res) => {
    if(!res.ok) {
        console.log("Error: ",res);
        return;        
    }
    return res.json();
})
.then((data) => {
    console.log("SucceSSfully added newData with POST");    
    console.log(data);    
})
.catch((error) => console.log(error))


// 'GET' by default
fetch('https://jsonplaceholder.typicode.com/posts')
.then((response) => {
    if(!response.ok) {
        console.log("Error: ", response.status);
        return;
    }
    return response.json();
})
.then((data) => {
    console.log(data); //Becoz we have array of objects
})
.catch((error) => console.log("Error: ", error));



//PUT 
const user = {
    username: "tulsi",
    id: "2025CS"
}
fetch('https://jsonplaceholder.typicode.com/posts/5', {
    method: 'PUT',
    headers: {
        'Content-Type': 'application/json'
    },
    body: JSON.stringify(user)
})
.then((res) => {
    if(!res.ok) {
        console.log("Error: ",res);
        return;        
    }
    return res.json();
})
.then((data) => {
    console.log("Successfully PUT");    
    console.log(data);    
})
.catch((error) => console.log(error))


// 'DELETE'
fetch('https://jsonplaceholder.typicode.com/posts/5', {
    method: 'DELETE'
}).then(response => {
    if(!response.ok) {
        console.log("Problem deleting");
        return;
    }
    return response.json();
}).then((data) => {
    console.log("Successfully deleted");    
})
.catch(error => console.log(error))

</script>
</html>
