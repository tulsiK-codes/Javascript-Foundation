<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Requests using XMLhttpRequest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #414141; color: #fff;">
    XML HTTPRequest
</body>

<script>
    const requestURL = `https://api.github.com/users/HiteshChoudhary`;

   const xhr = new XMLHttpRequest();

   xhr.open('GET', requestURL, true); //true for Asynchronous


//    console.log(xhr.readyState); //this runs once, so its only showing the '1' opened state. But its changing to other states also, which we can track using .onreadyStateChange()



   xhr.onreadystatechange = function () {
    console.log(xhr.readyState);
    if(xhr.readyState === 4) {
        const data = JSON.parse(this.responseText)
        console.log(data);
        console.log(data.followers);
    }
   }
   xhr.send();
</script>
</html>
